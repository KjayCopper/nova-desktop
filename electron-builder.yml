appId: com.novadesktop.app
productName: Nova
copyright: Copyright © 2026 Nova

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true
compression: maximum
npmRebuild: false

# Note: for GitHub releases electron-builder publishes one manifest per build:
#   stable build  → latest.yml (GitHub release)
#   beta build    → beta.yml   (GitHub pre-release; pass --config.publish.channel=beta)
# electron-updater reads latest.yml on the stable channel and beta.yml when
# allowPrerelease is enabled.

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  # Code signing is optional for updates but strongly recommended for trust.
  # Set CSC_LINK / CSC_KEY_PASSWORD in the environment (or CI secrets).
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Seeds the default install folder as D:\Nova (see build/installer.nsh) so a
  # click-through install never lands on the system drive.
  include: installer.nsh
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  differentialPackage: true

# IMPORTANT: replace owner/repo with your own GitHub repository before publishing.
# The same values must be used by electron-updater at runtime (baked into app-update.yml).
publish:
  provider: github
  owner: KjayCopper
  repo: nova-desktop
  releaseType: release

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "Tag v$tag does not match package.json version $version"
          }

      - name: Resolve release channel
        id: channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version.Contains("-")) {
            "channel=beta" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "channel=latest" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Generate icons
        run: npm run icons

      - name: Build application
        run: npm run build

      - name: Publish GitHub release
        run: npx electron-builder --win --publish always --config.publish.channel=${{ steps.channel.outputs.channel }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pre-release versions (0.2.0-beta.1) are published as GitHub pre-releases.
          EP_PRE_RELEASE: ${{ steps.channel.outputs.prerelease }}
          # Optional code signing:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
